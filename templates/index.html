<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Model AI Dedektörü</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            /* BUZ MAVİSİ PALETİ */
            --bg-gradient: linear-gradient(135deg, #e0f7fa 0%, #f0f4f8 100%); /* Çok açık buz mavisi */
            --card-bg: rgba(255, 255, 255, 0.95);
            --primary-blue: #0288d1;
            --accent-blue: #4fc3f7;
            --shadow-color: rgba(179, 229, 252, 0.4);
            --text-dark: #37474f;
            --text-light: #78909c;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 24px;
            /* Buzlu cam efekti veren modern gölge */
            box-shadow: 0 10px 40px var(--shadow-color), 0 1px 2px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 850px;
            border: 1px solid #e1f5fe;
        }

        h1 {
            text-align: center;
            color: #0277bd; /* Koyu buz mavisi */
            margin-bottom: 15px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p {
            text-align: center;
            color: var(--text-light);
            margin-bottom: 40px;
            font-size: 1.05rem;
        }

        /* INPUT ALANI */
        textarea {
            width: 100%;
            height: 150px;
            padding: 20px;
            border: 2px solid #e1f5fe;
            border-radius: 16px;
            font-size: 16px;
            font-family: 'Inter', sans-serif;
            margin-bottom: 25px;
            resize: vertical;
            box-sizing: border-box;
            background-color: #fbfdff;
            transition: all 0.3s ease;
            outline: none;
            color: #455a64;
        }

            textarea:focus {
                border-color: var(--accent-blue);
                background-color: #fff;
                box-shadow: 0 0 0 4px rgba(79, 195, 247, 0.15);
            }

            textarea::placeholder {
                color: #b0bec5;
            }

        /* BUTON */
        button {
            width: 100%;
            padding: 18px;

            /* 1. Önce yedek renk (Eski tarayıcılar için) */
            background-color: #0d47a1;
            /* 2. Gradient'i "background" değil "background-image" olarak tanımla */
            background-image: linear-gradient(120deg, #1565c0, #0d47a1);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(3, 155, 229, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

            button:hover {
                transform: translateY(-2px);
                box-shadow: 0 8px 25px rgba(3, 155, 229, 0.4);
                filter: brightness(1.05);
            }

        /* SONUÇ ALANI */
        .results-container {
            margin-top: 40px;
            border-top: 1px solid #e1f5fe;
            padding-top: 30px;
        }

            .results-container h3 {
                font-size: 1.2rem;
                color: #0277bd;
                margin-bottom: 20px;
                display: flex;
                align-items: center;
                gap: 10px;
            }

        /* KART TASARIMI */
        .model-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #ffffff;
            border: 1px solid #f1f8e9; /* Çok hafif */
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }

            .model-card:hover {
                transform: translateY(-3px);
                box-shadow: 0 10px 20px rgba(179, 229, 252, 0.4);
                border-color: #b3e5fc;
            }

        .model-name {
            font-weight: 600;
            width: 25%;
            color: #546e7a;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .prediction {
            font-weight: 700;
            width: 15%;
            text-align: center;
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        /* PROGRESS BAR */
        .progress-wrapper {
            width: 45%;
            background-color: #f1f5f9;
            border-radius: 50px;
            overflow: hidden;
            height: 24px;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
        }

        .progress-bar {
            height: 100%;
            text-align: center;
            line-height: 24px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* GÜVEN SKORU */
        .confidence-box {
            width: 15%;
            text-align: right;
            font-size: 0.9em;
            color: #90a4ae;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🤖 Multi-Model Analiz Paneli</h1>
        <p>Metni 4 farklı yapay zeka algoritması ile analiz edin.</p>

        <form action="/predict" method="POST">
            <textarea name="metin_kutusu" placeholder="Analiz edilecek metni buraya yapıştırın...">{{ metin }}</textarea>
            <button type="submit">
                <i class="fa-solid fa-wand-magic-sparkles"></i> Analiz Et
            </button>
        </form>

        {% if results %}
        <div class="results-container">
            <h3><i class="fa-solid fa-chart-pie"></i> Analiz Sonuçları</h3>

            {% for res in results %}
            <div class="model-card">
                <div class="model-name">
                    <i class="fa-solid fa-microchip" style="color: #81d4fa;"></i>
                    {{ res.name }}
                </div>

                <div class="prediction" style="color: {{ res.color }}">
                    {{ res.label }}
                </div>

                <div class="progress-wrapper">
                    <div class="progress-bar"
                         style="width: {{ res.raw_prob }}%;
                            background: {{ 'linear-gradient(90deg, #ef5350, #ff8a80)' if res.raw_prob > 50 else 'linear-gradient(90deg, #26a69a, #4db6ac)' }};">
                        AI Skoru: %{{ res.raw_prob|round(1) }}
                    </div>
                </div>

                <div class="confidence-box">
                    {{ res.probability }}<br>
                    <span style="font-size: 10px;">Güven</span>
                </div>
            </div>
            {% endfor %}

        </div>
        {% endif %}
    </div>

</body>
</html>
