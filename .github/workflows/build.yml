name: Build, Test and Analyze

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0  # SonarCloud için gerekli

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Projenin çalışması için gerekenler ve test araçları
          pip install flask pandas scikit-learn joblib pytest pytest-cov requests

      - name: Run Tests and Generate Report
        run: |
          # Testleri BURADA, sunucuda çalıştırıyoruz ki yollar doğru olsun
          # test_webAPI internete çıkmasın diye hariç tutabiliriz veya mockladıysan kalabilir
          pytest --cov=. --cov-report=xml --ignore=test_webAPI.py

      # SonarCloud taraması şimdi oluşan taze raporu okuyacak
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
